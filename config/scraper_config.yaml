# MC Stock Charts Scraper Configuration
# Validation filters applied to tickers fetched from MC Stock Charts reports.

# =============================================================================
# RATE LIMITER CONFIGURATION
# =============================================================================
# Alpaca API rate limits. Default matches Alpaca Paid Tier (10,000/min).
# Free tier users: Set max_requests to 200.

rate_limiter:
  max_requests: 10000      # Requests per window (200 for free tier, 10000 for paid)
  window_seconds: 60       # Time window in seconds

# =============================================================================
# TICKER VALIDATION FILTERS
# =============================================================================
# Tickers that fail any filter are silently skipped during validation.

validation:
  # Minimum share price (skip penny stocks and low-priced names)
  min_price: 10

  # Minimum market capitalization in dollars
  # $1B = large enough for institutional liquidity
  min_market_cap: 1000000000  # $1B

  # Minimum number of trading days of history required
  # 200 days covers the 200-day SMA calculation
  min_history_days: 200

  # Minimum average daily dollar volume in dollars
  # Ensures sufficient liquidity for position sizing
  # $20M = roughly 200k shares at $100 or 2M shares at $10
  min_dollar_volume: 20000000  # $20M

# =============================================================================
# FALSE POSITIVE FILTERS
# =============================================================================
# Common words that look like ticker symbols but aren't.
# These are checked case-insensitively.
# The default list is built into the scraper; add extras here.
extra_false_positives: []
#  - VIV   # Uncomment to skip a specific ticker

# =============================================================================
# UNIVERSE BUILDER CONFIGURATION
# =============================================================================
# Profiles for dynamic universe building in trend_screener.py
# Filters applied in order: asset → price → dollar volume (expensive)

universes:
  default: large_cap

  # Large-cap profile: institutional-quality names
  large_cap:
    min_price: 30
    min_dollar_volume: 80000000    # $80M average daily dollar volume
    lookback_days: 60              # For dollar volume calculation
    exclude_exchanges: ["OTC", "AMEX"]

  # High-octane profile: more aggressive, smaller names
  high_octane:
    min_price: 2
    min_dollar_volume: 20000000    # $20M average daily dollar volume
    lookback_days: 60
    exclude_exchanges: ["OTC", "AMEX"]
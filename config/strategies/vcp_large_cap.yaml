# VCP Large-Cap Strategy Parameters
# Authoritative source for vcp_large_cap strategy.
# Loaded by VCPBreakoutLargeCap via traderlib/strategy_config.py.
# Supersedes the vcp.large_cap section in risk_config.yaml (kept as fallback).

name: vcp_large_cap
description: "VCP Breakout — Institutional Quality ($5B+ market cap)"

# ---------------------------------------------------------------------------
# Universe filters
# ---------------------------------------------------------------------------
universe:
  min_market_cap: 5000        # $5B+ in millions
  min_dollar_volume: 80000000 # $80M avg daily dollar volume
  min_share_volume: 1000000   # 1M shares/day

# ---------------------------------------------------------------------------
# VCP pattern parameters
# ---------------------------------------------------------------------------
pattern:
  min_contractions: 2
  ideal_contractions: 3

  # Expected depth range [min%, max%] for each contraction in sequence.
  # Shallower, smoother contractions typical of large institutional names.
  contraction_ranges:
    - [15, 25]   # 1st contraction: 15-25%
    - [8, 12]    # 2nd contraction: 8-12%
    - [3, 8]     # 3rd contraction: 3-8% (tightest)

  # Each contraction should be 50-70% the depth of the previous one.
  max_contraction_size_ratio: 0.70
  min_contraction_size_ratio: 0.50
  reject_if_expanding: true     # Invalid if later contraction > earlier

# ---------------------------------------------------------------------------
# Volume requirements
# ---------------------------------------------------------------------------
volume:
  dry_up_threshold: 0.60       # Final base <60% of 50-day avg volume
  breakout_volume_min: 1.4     # Minimum 1.4x average on breakout day
  breakout_volume_grade_a: 2.0 # A-grade breakout: 2x average

# ---------------------------------------------------------------------------
# Entry filters
# ---------------------------------------------------------------------------
entry:
  min_stage2_score: 6          # Minimum Stage 2 score (0-10 scale)
  min_convergence_score: 50    # Minimum MA convergence score (0-100)
  max_pivot_proximity_pct: 5.0 # Enter within 5% of VCP pivot high

# ---------------------------------------------------------------------------
# Exit management — two-phase system
# ---------------------------------------------------------------------------
# Phase 1 (entry → phase2_trigger_r): hard stop, ratchet up to swing lows.
# Phase 2 (phase2_trigger_r+):        trail MA — this is "Stage 2 momentum mode".
#   The initial VCP stop/entry logic governs Phase 1; once the trade is working
#   at +2R the exit mode shifts to trailing the 20-day EMA, which is exactly
#   how Stage 2 momentum positions are managed (trail short MAs, avoid early exit).
exit:
  phase2_trigger_r: 2.0        # Switch to MA trail at +2R gain
  phase2_trail_ma: 20          # Trail with 20-day EMA in Phase 2 (Stage 2 mode)
  phase2_swing_low: true       # Also consider swing lows as trail candidates

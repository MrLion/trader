# Risk Management Configuration for Paper Trading Engine
# All percentages are expressed as decimals (0.0075 = 0.75%)

# =============================================================================
# ACCOUNT-LEVEL RISK SETTINGS
# =============================================================================
account:
  # Maximum risk per trade as % of total account equity
  # This is your R - the amount you're willing to lose if stop is hit
  risk_per_trade_pct: 0.005  # 0.5% of account per trade

  # Maximum daily loss before halting trading
  daily_loss_limit_pct: 0.02  # 2% of initial capital

  # Maximum positions per sector
  max_sector_positions: 10

  # Daily entry limit
  max_entries_per_day: 10

# =============================================================================
# POSITION-LEVEL RISK SETTINGS
# =============================================================================
position:
  # Maximum position size as % of account equity (hard cap)
  # Formula: position_value / equity <= max_position_pct
  max_position_pct: 0.10  # 5% max position regardless of stop distance

  # Alternative formula: min(account_risk / stop_distance, max_position_pct)
  # Example: 0.75% / 5% stop = 15% position, but capped at 5%

  # Minimum position size (to avoid tiny positions)
  min_position_pct: 0.05  # 5% of equity minimum

# =============================================================================
# STOP LOSS CONFIGURATION
# =============================================================================
stop_loss:
  # Method for calculating initial stop:
  # - "atr": Use 2x ATR below entry
  # - "atr_or_support": Use max(2x ATR, recent low)
  # - "atr_or_ma_support": Use max(2x ATR, recent low, MA support cluster)
  # - "percent": Fixed percentage below entry
  # - "pivot_based": Based on pivot/support levels
  # (method key removed — stop method is now chosen per-strategy in config/strategies/)

  # When method is "percent"
  fixed_pct: 0.07  # 7% below entry

  # ATR settings (when method uses ATR)
  atr:
    period: 14
    multiplier: 2.0  # 2x ATR

  # Hard limits on stop distance (safety rails)
  min_stop_distance_pct: 0.03   # Minimum 3% stop (tighter stops = larger positions)
  max_stop_distance_pct: 0.10   # Maximum 10% stop (rejects wide stops)

  # Fallback if calculation fails
  fallback_pct: 0.07  # 7% below entry

# =============================================================================
# MA SUPPORT STOP CONFIGURATION
# =============================================================================
# When enabled, calculates an alternative stop based on clustered moving averages
# below the price. The system uses max(ATR stop, MA support stop) for tighter
# risk management. MA support is used when MAs converge below price forming
# a natural support zone.
ma_support:
  enabled: true
  buffer_pct: 0.01  # 1% buffer below lowest cluster MA
  cluster_spread_pct: 0.05  # 5% max spread for convergence
  min_cluster_size: 2  # Minimum MAs required in cluster

# =============================================================================
# CACHE CONFIGURATION
# =============================================================================
cache:
  # Price data cache TTL in seconds
  ttl_seconds: 300  # 5 minutes

# =============================================================================
# PROFIT TARGET CONFIGURATION
# =============================================================================
profit_target:
  # Minimum R multiple to take profit
  min_r_multiple: 2.0  # At least 2:1 reward/risk

  # Fallback target if R calculation fails (decimal pct)
  fallback_target_pct: 0.10  # 10% above entry

  # Trailing stop activation levels
  trailing_stops:
    breakeven_at_r: 1.0      # Move to breakeven at +1R
    ema10_at_r: 1.5        # Trail 10 EMA starting at +1.5R
    ema21_at_r: 3.0        # Trail 21 EMA starting at +3R

  # EMA periods for trailing stops (days)
  ema_periods:
    short: 10    # EMA for early trailing (+1.5R)
    long: 21     # EMA for late trailing (+3R)

# =============================================================================
# ENTRY SCORE THRESHOLDS
# =============================================================================
entry:
  # Minimum entry score to trigger trade
  min_entry_score: 60

  # Maximum distance from pivot (in %)
  max_dist_to_pivot_pct: 2.0

  # Minimum volume ratio vs 20-day average
  min_volume_ratio: 1.5

# =============================================================================
# MARKET ENVIRONMENT FILTERS
# =============================================================================
market:
  # Maximum SPY decline to allow new entries
  max_spy_decline_pct: -0.5  # -0.5%

  # Maximum VIX level for new entries
  # max_vix: 35  # Uncomment to enable

# =============================================================================
# RE-ENTRY COOLDOWN CONFIGURATION
# =============================================================================
# Prevents immediate re-entry after position closure (FLY case study)
# See: memory/2026-04-11-fly-reentry-lesson.md
cooldown:
  # Minutes to wait before re-entering same ticker after exit
  # Default: 60 minutes (1 hour) - prevents FLY-style double loss
  reentry_cooldown_minutes: 60

  # Minimum loss % to trigger cooldown (0.0 = any loss triggers cooldown)
  # Set to 0.01 to only cooldown after 1%+ losses
  min_loss_to_trigger_cooldown_pct: 0.0

  # Maximum cooldown cap after consecutive losses
  max_cooldown_minutes: 240  # 4 hours

  # Multiply cooldown by this factor after each consecutive losing trade
  # Example: 60min -> 120min -> 240min (capped)
  consecutive_loss_multiplier: 2.0

# =============================================================================
# PRESET RISK PROFILES
# =============================================================================
# Use with: --risk-profile <name>
profiles:
  conservative:
    account:
      risk_per_trade_pct: 0.005    # 0.5%
    position:
      max_position_pct: 0.10       # 10%
    stop_loss:
      max_stop_distance_pct: 0.08  # 8% max
    ma_support:
      enabled: true
      buffer_pct: 0.015  # 1.5% buffer (wider stop, more conservative)
      cluster_spread_pct: 0.05
      min_cluster_size: 2

  aggressive:
    account:
      risk_per_trade_pct: 0.01     # 1.0%
    position:
      max_position_pct: 0.10       # 10%
    stop_loss:
      max_stop_distance_pct: 0.15  # 15% max
    ma_support:
      enabled: true
      buffer_pct: 0.005  # 0.5% buffer (tighter stop, more aggressive)
      cluster_spread_pct: 0.05
      min_cluster_size: 2

  tight_stops:
    # For setups with tight technical stops (pivot-based)
    stop_loss:
      method: "atr_or_support"
      min_stop_distance_pct: 0.02   # 2%
      max_stop_distance_pct: 0.05   # 5%
    position:
      max_position_pct: 0.15         # Can take larger positions with tight stops
    ma_support:
      enabled: true
      buffer_pct: 0.01
      cluster_spread_pct: 0.03  # 3% spread (tighter cluster requirement)
      min_cluster_size: 3  # Require 3 MAs in cluster

# =============================================================================
# VCP (Volatility Contraction Pattern) CONFIGURATION  [DEPRECATED]
# =============================================================================
# These values are now superseded by config/strategies/vcp_large_cap.yaml and
# config/strategies/vcp_high_octane.yaml.  VCPBreakoutBase._load_profile_params()
# reads the per-strategy YAML first; this block is only consulted as a fallback
# for any keys not present in the YAML.  Will be removed in a future release.
vcp:
  # Profile 1: Large-Cap (Institutional Quality)
  large_cap:
    # Market cap filter (in millions)
    min_market_cap: 5000  # $5B+

    # Liquidity requirements
    min_dollar_volume: 80000000  # $80M avg daily dollar volume
    min_share_volume: 1000000    # 1M shares/day

    # Contraction sequence: expected % ranges for each contraction
    # Format: [min%, max%] for each contraction (1st, 2nd, 3rd, ...)
    contraction_ranges:
      - [15, 25]   # 1st: 15-25%
      - [8, 12]    # 2nd: 8-12%
      - [3, 8]     # 3rd: 3-8%

    # Volume requirements
    volume_dry_up_threshold: 0.60  # Final contraction <60% of 50-day avg
    breakout_volume_min: 1.4       # Breakout at 1.4x average
    breakout_volume_grade_a: 2.0   # A-grade: 2x average

    # Exit management
    trail_ema_period: 20  # Trail with 20-day EMA after 2-3R
    phase1_r_multiple: 2.0  # Keep initial stop until +2R
    phase2_start_r: 2.0     # Switch to trailing at +2R

    # Entry proximity to pivot
    max_pivot_proximity_pct: 5.0  # Within 5% of pivot

    # MA convergence requirements
    min_convergence_score: 50  # Min convergence score (0-100)

  # Profile 2: High-Octane (Aggressive Growth)
  high_octane:
    # Market cap filter (in millions)
    min_market_cap: 250   # $250M+

    # Liquidity requirements (lower thresholds)
    min_dollar_volume: 20000000   # $20M avg daily dollar volume
    min_share_volume: 400000      # 400k shares/day

    # Contraction sequence: deeper first contraction
    contraction_ranges:
      - [30, 35]   # 1st: 30-35% (deeper)
      - [15, 15]   # 2nd: ~15%
      - [3, 6]     # 3rd: 3-6%

    # Volume requirements (stricter for thin names)
    volume_dry_up_threshold: 0.50  # Final contraction <50% of 50-day avg
    breakout_volume_min: 2.0       # Breakout at 2x average (stricter)
    breakout_volume_grade_a: 2.5   # A-grade: 2.5x average

    # Exit management (tighter for volatile names)
    trail_ema_period: 10   # Trail with 10-day EMA after 2-3R
    phase1_r_multiple: 2.0  # Keep initial stop until +2R
    phase2_start_r: 2.0     # Switch to trailing at +2R

    # Entry proximity to pivot
    max_pivot_proximity_pct: 5.0  # Within 5% of pivot

    # MA convergence requirements
    min_convergence_score: 50  # Min convergence score (0-100)

  # Common VCP settings (applies to both profiles)
  common:
    # Minimum contractions required
    min_contractions: 2
    ideal_contractions: 3

    # Contraction validation
    # Each contraction should be 50-70% of previous
    max_contraction_size_ratio: 0.70  # 70% of previous max
    min_contraction_size_ratio: 0.50  # 50% of previous min

    # Pattern invalidation
    reject_if_expanding: true  # Reject if later contraction > earlier

    # Stage 2 requirements
    min_stage2_score: 5  # Minimum Stage 2 score

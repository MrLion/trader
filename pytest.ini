[pytest]
minversion = 6.0
testpaths = tests
asyncio_mode = auto
addopts =
    -v
    --cov=scripts
    --cov-branch
    --cov-report=term-missing
    --cov-report=html:.gstack/qa-reports/coverage/html
    --cov-report=xml:.gstack/qa-reports/coverage/coverage.xml

[coverage:run]
source = scripts
omit =
    */__pycache__/*
    */tests/*
    */test_*
    scripts/setup_alpaca.py
    scripts/validate_alpaca.py

[coverage:report]
precision = 1
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:

[coverage:html]
directory = .gstack/qa-reports/coverage/html

[coverage:xml]
output = .gstack/qa-reports/coverage/coverage.xml
